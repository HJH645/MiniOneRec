# 阅读导航：rl.sh 的 accelerate --config_file 指向本文件。
# distributed_type=DEEPSPEED 选择训练后端，num_processes 由启动命令指定；
# zero_stage=2 将优化器状态与梯度按进程切分，mixed_precision=bf16 控制精度。
# 先理解 rl.py 单进程的数据和 loss，再用这里解释多 GPU 参数如何分布。
# DeepSpeed ZeRO-2 配置：供 rl.sh 的 accelerate 使用。
# 先理解 sft/rl 单卡逻辑，再学习这里的参数切分和 bf16。
compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
num_machines: 1
# num_processes: 8
mixed_precision: bf16

deepspeed_config:
  zero_stage: 2
  contiguous_gradients: true
  overlap_comm: true
  reduce_scatter: true
  reduce_bucket_size: 5e8
  allgather_bucket_size: 5e8
  offload_optimizer_device: none
  offload_param_device: none
#  gradient_accumulation_steps: 1
#  optimize_with_dynamo: true
# optimize_model_with_dynamo: true
# dynamo_backend: inductor
debug: false
